name: Build OpenWrt APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 test_backend.py
      - run: node test_frontend.cjs
      - run: python3 tests/check_package.py
      - run: python3 -m unittest discover -s tests -p test_signing.py

  build:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check out the official SDK build entrypoint
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: openwrt/gh-action-sdk
          ref: f5813d30eeef3534b58ac7e79c5d8842b6035434
          path: sdk-action
      - name: Prepare isolated package feed
        run: |
          mkdir -p feed/luci-app-fail2ban-manager artifacts dist
          cp Makefile feed/luci-app-fail2ban-manager/
          cp -R root feed/luci-app-fail2ban-manager/
      - name: Prepare APK signing key
        env:
          SAVED_KEY: ${{ github.event_name != 'pull_request' && secrets.APK_SIGNING_KEY || '' }}
        run: |
          umask 077
          key="$RUNNER_TEMP/fail2ban-manager-signing.pem"
          if [ -n "$SAVED_KEY" ]; then
            printf '%s\n' "$SAVED_KEY" > "$key"
          else
            openssl ecparam -name prime256v1 -genkey -noout -out "$key"
            echo '::warning::One-build signing key. Configure APK_SIGNING_KEY for stable release trust.'
          fi
          openssl pkey -in "$key" -pubout -out dist/luci-fail2ban-manager.pem
          chmod 644 dist/luci-fail2ban-manager.pem
          python3 - <<'PY'
          import os
          from pathlib import Path
          key = (Path(os.environ['RUNNER_TEMP']) / 'fail2ban-manager-signing.pem').read_text().strip()
          print('::add-mask::' + key.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('PRIVATE_KEY<<F2B_SIGNING_KEY\n' + key + '\nF2B_SIGNING_KEY\n')
          PY
      - name: Build using official OpenWrt SDK
        run: |
          docker build --build-arg CONTAINER=ghcr.io/openwrt/sdk \
            --build-arg ARCH=x86_64-25.12.5 -t manager-sdk sdk-action
          sudo chown -R 1000:1000 feed artifacts
          docker run --rm --env PRIVATE_KEY \
            --env UPSTREAM_URL=https://downloads.openwrt.org \
            --env FEEDNAME=manager --env PACKAGES=luci-app-fail2ban-manager \
            --env INDEX=0 --env V=s \
            -v "$GITHUB_WORKSPACE/feed:/feed" \
            -v "$GITHUB_WORKSPACE/artifacts:/artifacts" \
            -v "$GITHUB_WORKSPACE/dist:/public-key:ro" \
            -v "$GITHUB_WORKSPACE/ci:/ci:ro" \
            --entrypoint /bin/bash manager-sdk -ec '
              if [ -f setup.sh ]; then
                bash setup.sh
                mv setup.sh setup.completed.sh
              fi
              python3 /ci/signing.py prepare --public-key /public-key/luci-fail2ban-manager.pem
              bash /entrypoint.sh
              python3 /ci/signing.py verify --public-key /public-key/luci-fail2ban-manager.pem
            '
      - name: Restore output ownership
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" artifacts feed
      - name: Collect only the manager APK and public key
        run: |
          find artifacts/bin -name 'luci-app-fail2ban-manager-*.apk' -exec cp '{}' dist/ \;
          test "$(find dist -name '*.apk' | wc -l)" -eq 1
          cp artifacts/signing-verification.json dist/
          cp README.md LICENSE dist/
          cd dist
          sha256sum *.apk *.pem signing-verification.json > SHA256SUMS
          openssl pkey -pubin -in luci-fail2ban-manager.pem -outform DER | sha256sum > PUBLIC_KEY_SHA256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: luci-app-fail2ban-manager-openwrt-25.12
          path: dist/
          if-no-files-found: error
      - name: Remove runner signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/fail2ban-manager-signing.pem"

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: luci-app-fail2ban-manager-openwrt-25.12
          path: dist
      - name: Publish signed APK and verification files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag \
            --title "LuCI Fail2ban Manager $RELEASE_TAG" \
            --notes 'OpenWrt 25.12 APK. Existing Fail2ban rules are not replaced. Read README.md and verify the publisher key before installing. One-build keys rotate unless APK_SIGNING_KEY is configured.' \
            dist/*.apk dist/*.pem dist/SHA256SUMS dist/PUBLIC_KEY_SHA256 dist/signing-verification.json dist/README.md dist/LICENSE
